<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고마워요 미스테리 박스 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --card:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08);
  --gold:#e8c87a;
  --gold2:#f5e0a0;
  --dim:rgba(255,255,255,.35);
  --mid:rgba(255,255,255,.65);
  --white:#fff;
  /* 등급 색상 */
  --f:#888;--e:#aaa;--d:#7ecbe6;--c:#6fd18a;--b:#b97aff;
  --a:#ff9f4a;--s:#ff6b6b;--ss:#e8c87a;--sss:#fff;
}
html,body{min-height:100vh;background:var(--bg);color:var(--white);font-family:'Noto Serif KR',serif;overflow-x:hidden}

/* 배경 파티클 */
.bg-stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) var(--del,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.1;transform:scale(1)}100%{opacity:.6;transform:scale(1.5)}}

/* 탭 네비 */
.nav{position:relative;z-index:10;display:flex;justify-content:center;gap:0;padding:28px 0 0;border-bottom:1px solid var(--border)}
.nav-btn{background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;padding:10px 28px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.5px}
.nav-btn.on{color:var(--gold);border-color:var(--gold)}
.nav-btn:hover{color:var(--mid)}

/* 공통 레이아웃 */
.page{display:none;max-width:640px;margin:0 auto;padding:36px 20px 60px;position:relative;z-index:1}
.page.on{display:block}
.page-title{font-size:24px;font-weight:900;color:var(--gold);text-align:center;margin-bottom:6px;letter-spacing:1px}
.page-sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:32px}

/* 입력 컴포넌트 */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.label{font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-family:'DM Mono',monospace}
.inp{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:#fff;font-family:'Noto Serif KR',serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:rgba(232,200,122,.4)}
.inp::placeholder{color:var(--dim)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:none;border-radius:10px;padding:12px 20px;font-family:inherit;font-size:14px;cursor:pointer;font-weight:700;letter-spacing:.5px;transition:all .2s}
.btn-gold{background:var(--gold);color:#0a0a0f}.btn-gold:hover{background:var(--gold2)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--mid)}.btn-ghost:hover{border-color:rgba(232,200,122,.3);color:var(--gold)}
.btn-danger{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.25);color:#ff6b6b}
.btn-full{width:100%;margin-top:8px}

/* 상품 행 */
.items-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.item-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.grade-badge{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;background:rgba(255,255,255,.08)}
.del-item{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.2);color:#ff6b6b;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}

/* 박스 목록 */
.box-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.box-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.box-card-title{font-size:15px;font-weight:700;margin-bottom:4px;color:var(--gold)}
.box-card-meta{font-size:12px;color:var(--dim);font-family:'DM Mono',monospace;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.box-card-actions{display:flex;gap:8px}
.copy-input{font-family:'DM Mono',monospace;font-size:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--mid);width:100%;margin-top:8px;cursor:text}

/* 코드 입력 (수령자) */
.code-wrap{text-align:center;margin-bottom:32px}
.code-inp-big{background:rgba(255,255,255,.06);border:2px solid var(--border);border-radius:14px;padding:16px 20px;color:#fff;font-family:'DM Mono',monospace;font-size:18px;text-align:center;outline:none;width:100%;letter-spacing:4px;transition:border-color .2s;margin-bottom:12px}
.code-inp-big:focus{border-color:rgba(232,200,122,.5)}

/* 보관함 박스들 */
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:20px}
.vault-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.vault-box:hover{border-color:rgba(232,200,122,.35);transform:translateY(-3px)}
.vault-box .box-icon{font-size:36px;margin-bottom:8px;display:block}
.vault-box .box-name{font-size:12px;color:var(--mid);font-weight:700;margin-bottom:4px}
.vault-box .box-expires{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace}
.vault-box.opened{pointer-events:none}

/* ══ 개봉 오버레이 ══ */
.open-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(12px)}
.open-overlay.show{display:flex}
.open-stage{position:relative;width:320px;text-align:center}

/* 박스 */
.box-3d{width:160px;height:160px;margin:0 auto 24px;position:relative;cursor:pointer}
.box-body{position:absolute;bottom:0;width:100%;height:120px;background:linear-gradient(135deg,#c8661a,#e07820);border-radius:12px 12px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 32px rgba(200,102,26,.4)}
.box-lid{position:absolute;top:0;width:100%;height:50px;background:linear-gradient(135deg,#d97020,#f08830);border-radius:10px;transform-origin:bottom center;transition:transform .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 -4px 16px rgba(200,102,26,.3)}
.box-bow{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:24px;transition:transform .4s ease,opacity .4s}

/* 흔들기 */
@keyframes shake{
  0%,100%{transform:rotate(0deg) translateY(0)}
  15%{transform:rotate(-8deg) translateY(-4px)}
  30%{transform:rotate(8deg) translateY(-6px)}
  45%{transform:rotate(-6deg) translateY(-4px)}
  60%{transform:rotate(6deg) translateY(-8px)}
  75%{transform:rotate(-4deg) translateY(-4px)}
  90%{transform:rotate(4deg) translateY(-2px)}
}
.box-3d.shaking{animation:shake .7s ease-in-out 3}

/* 조명 이펙트 */
.spotlight{position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:200px;height:200px;background:radial-gradient(ellipse,rgba(232,200,122,.0) 0%,transparent 70%);border-radius:50%;transition:all .5s;pointer-events:none}
.spotlight.on{background:radial-gradient(ellipse,rgba(232,200,122,.35) 0%,transparent 70%)}

/* 결과 카드 */
.result-card{display:none;animation:resultIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes resultIn{0%{opacity:0;transform:scale(.5) translateY(40px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.result-grade{font-family:'DM Mono',monospace;font-size:48px;font-weight:700;margin-bottom:8px;text-shadow:0 0 40px currentColor}
.result-item{font-size:20px;font-weight:700;margin-bottom:6px}
.result-label{font-size:13px;color:var(--dim);margin-bottom:24px;font-family:'DM Mono',monospace}

/* 파티클 */
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:particleUp 1s ease-out both}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(0)}}

/* 등급별 조명 */
.grade-F .spotlight.on{background:radial-gradient(ellipse,rgba(136,136,136,.2) 0%,transparent 70%)}
.grade-E .spotlight.on{background:radial-gradient(ellipse,rgba(170,170,170,.2) 0%,transparent 70%)}
.grade-D .spotlight.on{background:radial-gradient(ellipse,rgba(126,203,230,.3) 0%,transparent 70%)}
.grade-C .spotlight.on{background:radial-gradient(ellipse,rgba(111,209,138,.3) 0%,transparent 70%)}
.grade-B .spotlight.on{background:radial-gradient(ellipse,rgba(185,122,255,.35) 0%,transparent 70%)}
.grade-A .spotlight.on{background:radial-gradient(ellipse,rgba(255,159,74,.4) 0%,transparent 70%)}
.grade-S .spotlight.on{background:radial-gradient(ellipse,rgba(255,107,107,.5) 0%,transparent 70%)}
.grade-SS .spotlight.on{background:radial-gradient(ellipse,rgba(232,200,122,.6) 0%,transparent 70%)}
.grade-SSS .spotlight.on{background:radial-gradient(ellipse,rgba(255,255,255,.8) 0%,transparent 65%);animation:sssFlicker 1s ease-in-out infinite alternate}
@keyframes sssFlicker{0%{opacity:.8}100%{opacity:1}}

/* 상태 메시지 */
.status{font-size:13px;text-align:center;padding:10px;border-radius:8px;margin-top:12px}
.status.err{background:rgba(255,80,80,.1);color:#ff6b6b;border:1px solid rgba(255,80,80,.2)}
.status.ok{background:rgba(100,200,100,.1);color:#6fd18a;border:1px solid rgba(100,200,100,.2)}
.status.loading{color:var(--dim)}

.empty{text-align:center;color:var(--dim);font-size:13px;padding:32px;font-style:italic}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim-up{animation:up .3s ease both}

/* SSS 전체화면 */
.sss-burst{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(255,255,255,.15) 0%,rgba(0,0,0,.97) 70%);animation:sssBg 1.5s ease-out}
.sss-burst.show{display:flex}
@keyframes sssBg{0%{background:radial-gradient(ellipse at center,rgba(255,255,255,.8) 0%,rgba(0,0,0,.5) 70%)}100%{background:radial-gradient(ellipse at center,rgba(255,255,255,.15) 0%,rgba(0,0,0,.97) 70%)}}
.sss-text{font-size:80px;font-weight:900;color:#fff;text-shadow:0 0 60px #fff,0 0 120px rgba(232,200,122,.8);animation:sssText 1s ease-out both;text-align:center}
@keyframes sssText{0%{opacity:0;transform:scale(3)}50%{opacity:1;transform:scale(0.9)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<!-- 배경 별 -->
<div class="bg-stars" id="bgStars"></div>

<!-- 내비 -->
<div class="nav">
  <button class="nav-btn on" onclick="switchTab('admin')">🎁 박스 관리</button>
  <button class="nav-btn" onclick="switchTab('user')">📬 박스 수령</button>
</div>

<!-- ═══ 관리자 탭 ═══ -->
<div class="page on" id="tab-admin">
  <div class="page-title">박스 만들기</div>
  <div class="page-sub">상품을 입력하면 등급이 자동으로 배정됩니다</div>

  <div class="card" style="margin-bottom:16px">
    <div class="field">
      <div class="label">박스 이름</div>
      <input class="inp" id="admin-name" placeholder="예: 다이겨 감사 박스">
    </div>
    <div class="row2">
      <div class="field">
        <div class="label">유효기간</div>
        <input class="inp" id="admin-expires" type="date">
      </div>
      <div class="field">
        <div class="label">발급 수량 (0=무제한)</div>
        <input class="inp" id="admin-limit" type="number" value="1" min="0">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" id="admin-show-items" style="width:18px;height:18px;accent-color:var(--gold)">
          <span style="font-size:13px;color:var(--mid)">수령자에게 상품 목록 공개 <span style="color:var(--dim);font-size:11px">(열기 전 목록 확인 가능)</span></span>
        </label>
      </div>
    </div>

    <div class="label" style="margin-bottom:8px">상품 목록</div>
    <div class="items-wrap" id="adminItems"></div>
    <button class="btn btn-ghost" onclick="addAdminItem()" style="font-size:13px;padding:8px 14px;margin-bottom:16px">+ 상품 추가</button>

    <div id="admin-status" class="status loading" style="display:none"></div>
    <button class="btn btn-gold btn-full" onclick="createBox()">🎁 박스 생성하기</button>
  </div>

  <!-- 생성된 박스 목록 -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="font-size:14px;color:var(--mid);font-weight:700">생성된 박스</div>
    <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="loadAdminBoxes()">↻ 새로고침</button>
  </div>
  <div class="box-list" id="adminBoxList"><div class="empty">로딩 중...</div></div>
</div>

<!-- ═══ 수령자 탭 ═══ -->
<div class="page" id="tab-user">
  <div class="page-title">박스 수령하기</div>
  <div class="page-sub">받은 코드를 입력하거나 링크로 접속하세요</div>

  <div class="code-wrap">
    <input class="code-inp-big" id="user-code" placeholder="박스 코드 입력" maxlength="36"
      onkeydown="if(event.key==='Enter')claimBox()">
    <input class="inp" id="user-name" placeholder="수령인 이름 (예: 홍길동)" style="margin-bottom:10px;text-align:center;font-size:15px">
    <button class="btn btn-gold" style="width:100%;padding:13px" onclick="claimBox()">📬 박스 수령</button>
    <div id="claim-status" class="status" style="display:none"></div>
  </div>

  <div style="font-size:14px;color:var(--mid);font-weight:700;margin-bottom:12px">보관함</div>
  <div class="vault" id="userVault">
    <div class="empty" style="grid-column:1/-1">수령한 박스가 없습니다</div>
  </div>
</div>

<!-- ═══ 개봉 오버레이 ═══ -->
<div class="open-overlay" id="openOverlay">
  <div class="open-stage" id="openStage">
    <div class="spotlight" id="spotlight"></div>
    <div class="particles" id="particles"></div>

    <!-- 박스 -->
    <div class="box-3d" id="box3d" onclick="startOpen()">
      <div class="box-bow" id="boxBow">🎀</div>
      <div class="box-lid" id="boxLid"></div>
      <div class="box-body" id="boxBody">🎁</div>
    </div>

    <div id="open-hint" style="font-size:14px;color:var(--dim);margin-bottom:16px">탭해서 열어보세요</div>

    <!-- 결과 -->
    <div class="result-card" id="resultCard">
      <div class="result-grade" id="resultGrade"></div>
      <div class="result-item" id="resultItem"></div>
      <div class="result-label" id="resultLabel"></div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="closeOverlay()">닫기</button>
      </div>
    </div>


  </div>
</div>


<!-- 상품 목록 모달 -->
<div class="open-overlay" id="itemsModal" style="align-items:center">
  <div style="background:#14141f;border:1px solid var(--border);border-radius:20px;padding:28px 24px;max-width:340px;width:90%;position:relative">
    <button onclick="document.getElementById('itemsModal').classList.remove('show')"
      style="position:absolute;top:14px;right:16px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer">✕</button>
    <div style="font-size:16px;font-weight:700;color:var(--gold);margin-bottom:4px" id="itemsModalTitle">🎁 박스</div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:16px">이 박스에 담긴 상품 목록</div>
    <div id="itemsModalList" style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto"></div>
    <button class="btn btn-gold" style="width:100%;margin-top:18px" id="itemsModalOpenBtn">🎁 지금 열기</button>
  </div>
</div>
<!-- SSS 이펙트 -->
<div class="sss-burst" id="sssBurst">
  <div>
    <div class="sss-text">✨ SSS ✨</div>
    <div style="font-size:18px;color:var(--gold);margin-top:16px;text-align:center" id="sssItemText"></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzIAkczdJvxofOCdWmc_m9xiemfJnflQRZvvLZ1ll6EC2tY-gfg4rIG5tRoTAzJVfwstg/exec';

// 등급 정의
const GRADES = [
  {grade:'SSS', pct:0.0001, color:'#fff'},
  {grade:'SS',  pct:0.001,  color:'#e8c87a'},
  {grade:'S',   pct:0.1,    color:'#ff6b6b'},
  {grade:'A',   pct:1,      color:'#ff9f4a'},
  {grade:'B',   pct:5,      color:'#b97aff'},
  {grade:'C',   pct:15,     color:'#6fd18a'},
  {grade:'D',   pct:25,     color:'#7ecbe6'},
  {grade:'E',   pct:30,     color:'#aaa'},
  {grade:'F',   pct:23.8989, color:'#888'},
];

// 상품 수에 따른 등급 자동배정

function copyBoxLink(uuid){
  const shareUrl = location.href.split('?')[0]+'?box='+uuid;
  if(navigator.clipboard&&location.protocol==='https:'){
    navigator.clipboard.writeText(shareUrl).then(()=>alert('링크 복사됨!\n'+shareUrl)).catch(fallback);
  } else {
    fallback();
  }
  function fallback(){
    const t=document.createElement('textarea');
    t.value=shareUrl;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    alert('링크 복사됨!\n'+shareUrl);
  }
}
function assignGrades(count) {
  if(count === 0) return [];
  const gradeOrder = ['SSS','SS','S','A','B','C','D','E','F'];
  const result = [];
  for(let i=0;i<count;i++) result.push(gradeOrder[Math.min(i, gradeOrder.length-1)]);
  return result;
}

// 배경 별 생성
function initStars(){
  const c=document.getElementById('bgStars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:${Math.random()*4}s;opacity:${Math.random()*.4}`;
    c.appendChild(s);
  }
}
initStars();

// 탭 전환
function switchTab(name){
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('on',['admin','user'][i]===name));
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('on',['tab-admin','tab-user'][i]==='tab-'+name));
  if(name==='admin') loadAdminBoxes();
  if(name==='user') renderVault();
}

// ══ 관리자 ══
let adminItems = [];
let adminRowCount = 0;

function addAdminItem(){
  const id = adminRowCount++;
  adminItems.push({id, text:''});
  renderAdminItems();
}

function removeAdminItem(id){
  adminItems = adminItems.filter(i=>i.id!==id);
  renderAdminItems();
}

function renderAdminItems(){
  const grades = assignGrades(adminItems.length);
  const wrap = document.getElementById('adminItems');
  if(!adminItems.length){
    wrap.innerHTML = '<div style="font-size:13px;color:var(--dim);text-align:center;padding:12px 0">상품을 추가해주세요</div>';
    return;
  }
  wrap.innerHTML = adminItems.map((item,i) => {
    const g = grades[i];
    const gInfo = GRADES.find(x=>x.grade===g);
    const pct = g==='SSS'?'0.0001%':gInfo?gInfo.pct+'%':'';
    return `<div class="item-row anim-up">
      <div class="grade-badge" style="color:${gInfo?.color||'#aaa'}">${g} <span style="opacity:.5;font-size:10px">${pct}</span></div>
      <input class="inp" style="font-size:13px;padding:8px 12px" placeholder="상품명 입력"
        value="${item.text}" oninput="(function(el,id){const found=adminItems.find(x=>x.id===id);if(found)found.text=el.value;})(this,${item.id})">
      <button class="del-item" onclick="removeAdminItem(${item.id})">✕</button>
    </div>`;
  }).join('');
}

async function createBox(){
  const name = document.getElementById('admin-name').value.trim();
  const expires = document.getElementById('admin-expires').value;
  const limit = parseInt(document.getElementById('admin-limit').value)||0;
  const showItems = document.getElementById('admin-show-items').checked;
  const st = document.getElementById('admin-status');

  if(!name){alert('박스 이름을 입력해주세요.');return;}
  if(!adminItems.length){alert('상품을 하나 이상 추가해주세요.');return;}

  const grades = assignGrades(adminItems.length);
  const items = adminItems.map((item,i)=>({grade:grades[i], name:item.text||'(상품명 없음)'}));

  st.style.display='block'; st.className='status loading'; st.textContent='생성 중...';

  try{
    let res;
    try{
      res = await fetch(`https://corsproxy.io/?${encodeURIComponent(API)}`,{
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'create', name, items, expires, limit, showItems})
      });
    }catch(e){
      res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(API)}`,{
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'create', name, items, expires, limit, showItems})
      });
    }
    const data = await res.json();
    if(data.ok){
      st.className='status ok'; st.textContent=`✓ 박스 생성 완료! UUID: ${data.uuid}`;
      document.getElementById('admin-name').value='';
      adminItems=[]; renderAdminItems();
      loadAdminBoxes();
    } else {
      st.className='status err'; st.textContent=data.error||'생성 실패';
    }
  }catch(e){
    st.className='status err'; st.textContent='네트워크 오류. 잠시 후 다시 시도해주세요.';
  }
}

async function loadAdminBoxes(){
  const list = document.getElementById('adminBoxList');
  list.innerHTML='<div class="empty">불러오는 중...</div>';
  try{
    const url = `https://corsproxy.io/?${encodeURIComponent(API+'?action=list')}`;
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok||!data.boxes?.length){list.innerHTML='<div class="empty">생성된 박스가 없습니다</div>';return;}
    list.innerHTML = data.boxes.map(box=>{
      const shareUrl = location.href.split('?')[0]+'?box='+box.uuid;
      const isExp = box.expires&&new Date(box.expires.split('T')[0]+'T23:59:59')<new Date();
      return `<div class="box-card anim-up">
        <div class="box-card-title">${box.name}</div>
        <div class="box-card-meta">
          <span>상품 ${box.items?.length||0}개</span>
          <span>개봉 ${box.openCount}회${box.limit?'/'+box.limit:''}회</span>
          ${box.expires?('<span '+(isExp?'style="color:#ff6b6b"':'')+'>~'+box.expires+(isExp?' (만료)':'')+'</span>'):''}
        </div>
        <input class="copy-input" value="${box.uuid}" readonly onclick="this.select();document.execCommand('copy');this.value='복사됨!';setTimeout(()=>this.value=this.defaultValue,1500)">
        <div class="box-card-actions" style="margin-top:8px">
          <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px"
            onclick="copyBoxLink('${box.uuid}')">🔗 링크 복사</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML='<div class="empty">로드 실패. 새로고침해주세요.</div>';
  }
}

// ══ 수령자 ══
let vault = JSON.parse(localStorage.getItem('mb-vault')||'[]');

async function claimBox(){
  const code = document.getElementById('user-code').value.trim();
  const userName = document.getElementById('user-name').value.trim();
  const st = document.getElementById('claim-status');
  if(!code){alert('코드를 입력해주세요.');return;}

  // 이미 보관함에 있으면
  if(vault.find(b=>b.uuid===code)){
    st.style.display='block'; st.className='status err'; st.textContent='이미 보관함에 있는 박스입니다.'; return;
  }

  st.style.display='block'; st.className='status loading'; st.textContent='박스 확인 중...';

  try{
    let res;
    try{
      res = await fetch(`https://corsproxy.io/?${encodeURIComponent(API+'?action=get&uuid='+code)}`);
    }catch(e){
      res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(API+'?action=get&uuid='+code)}`);
    }
    const data = await res.json();
    if(!data.ok){st.className='status err'; st.textContent=data.error; return;}

    const box = data.box;
    if(box.isExpired){st.className='status err'; st.textContent='유효기간이 만료된 박스입니다.'; return;}
    if(box.isExhausted||box.isOpened){st.className='status err'; st.textContent='이미 모두 개봉된 박스입니다.'; return;}

    vault.unshift({uuid:box.uuid, name:box.name, items:box.items, expires:box.expires, opened:false, userName:userName, showItems:box.showItems||false});
    localStorage.setItem('mb-vault', JSON.stringify(vault));
    st.className='status ok'; st.textContent='✓ 박스가 보관함에 추가됐습니다!';
    document.getElementById('user-code').value='';
    document.getElementById('user-name').value='';
    renderVault();
  }catch(e){
    st.className='status err'; st.textContent='네트워크 오류.';
  }
}

function renderVault(){
  const vaultEl = document.getElementById('userVault');
  const active = vault.filter(b=>!b.opened);
  const opened = vault.filter(b=>b.opened);
  const all = [...active,...opened];
  if(!all.length){
    vaultEl.innerHTML='<div class="empty" style="grid-column:1/-1">수령한 박스가 없습니다</div>'; return;
  }
  vaultEl.innerHTML = all.map(box=>`
    <div class="vault-box ${box.opened?'opened':''}" 
      ${!box.opened?`onclick="handleVaultClick('${box.uuid}')"`:'style="pointer-events:none;opacity:.8"'}
    >
      <span class="box-icon">${box.opened?'📭':'🎁'}</span>
      <div class="box-name">${box.name}</div>
      ${box.opened&&box.result
        ? `<div style="font-size:13px;font-weight:700;color:${box.result.color||'#aaa'};margin-top:4px">${box.result.grade}등급</div>
           <div style="font-size:11px;color:#fff;margin-top:2px;word-break:keep-all;line-height:1.4">${box.result.item}</div>
           ${(box.result.userName||box.userName)?`<div style="font-size:10px;color:var(--gold);margin-top:4px;font-family:'DM Mono',monospace">👤 ${box.result.userName||box.userName}</div>`:''}`
        : box.expires&&!box.opened?`<div class="box-expires">~${box.expires.split('T')[0]}</div>`:''
      }
    </div>`).join('');
}

// ══ 개봉 UI ══
let currentBoxUUID = '';
let openPhase = 0; // 0:대기 1:흔들기 2:열리는중 3:결과


function handleVaultClick(uuid){
  const box = vault.find(b=>b.uuid===uuid);
  if(!box||box.opened) return;
  if(box.showItems){
    showItemsModal(box);
  } else {
    openBoxUI(uuid);
  }
}

function showItemsModal(box){
  document.getElementById('itemsModalTitle').textContent='🎁 '+box.name;
  const grades = ['SSS','SS','S','A','B','C','D','E','F'];
  const list = document.getElementById('itemsModalList');
  list.innerHTML = (box.items||[]).map((item,i)=>`
    <div style="background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:22px">🎁</span>
      <span style="font-size:14px;color:#fff;font-weight:600">${item.name||'(상품명 없음)'}</span>
    </div>`).join('');
  document.getElementById('itemsModalOpenBtn').onclick = ()=>{
    document.getElementById('itemsModal').classList.remove('show');
    openBoxUI(box.uuid);
  };
  document.getElementById('itemsModal').classList.add('show');
}
function openBoxUI(uuid){
  currentBoxUUID = uuid;
  openPhase = 0;
  document.getElementById('openOverlay').classList.add('show');
  document.getElementById('open-hint').style.display='block';
  document.getElementById('resultCard').style.display='none';
  document.getElementById('box3d').style.display='block';
  document.getElementById('boxLid').style.transform='';
  document.getElementById('boxBow').style.opacity='1';
  document.getElementById('spotlight').className='spotlight';
  document.getElementById('openStage').className='open-stage';
  document.getElementById('particles').innerHTML='';
}

function closeOverlay(){
  document.getElementById('openOverlay').classList.remove('show');
  document.getElementById('sssBurst').classList.remove('show');
}

async function startOpen(){
  if(openPhase!==0)return;
  openPhase=1;
  document.getElementById('open-hint').textContent='박스가 흔들리고 있어요...';

  const box3d = document.getElementById('box3d');
  box3d.classList.add('shaking');

  // 흔들기 2초
  await sleep(2100);
  box3d.classList.remove('shaking');
  openPhase=2;

  // 실제 확률 계산
  const vaultBox = vault.find(b=>b.uuid===currentBoxUUID);
  const result = roll(vaultBox?.items||[{grade:'F',name:'꽝'}]);

  // 등급별 조명
  const stage = document.getElementById('openStage');
  stage.className = `open-stage grade-${result.grade}`;
  const sl = document.getElementById('spotlight');
  sl.classList.add('on');

  await sleep(400);

  // 뚜껑 열기
  document.getElementById('boxBow').style.opacity='0';
  document.getElementById('boxLid').style.transform='rotateX(-120deg) translateY(-30px)';

  await sleep(700);

  // 파티클
  spawnParticles(result.gInfo?.color||'#fff');

  // SSS 특수 효과
  if(result.grade==='SSS'){
    const burst = document.getElementById('sssBurst');
    document.getElementById('sssItemText').textContent=result.item;
    burst.classList.add('show');
    await sleep(2500);
    burst.classList.remove('show');
  }

  // 결과 기록 API
  try{
    try{
      await fetch(`https://corsproxy.io/?${encodeURIComponent(API)}`,{
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'open', uuid:currentBoxUUID, grade:result.grade, item:result.item, memo:vault.find(b=>b.uuid===currentBoxUUID)?.userName||''})
      });
    }catch(e){
      await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(API)}`,{
        method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action:'open', uuid:currentBoxUUID, grade:result.grade, item:result.item, memo:vault.find(b=>b.uuid===currentBoxUUID)?.userName||''})
      });
    }
  }catch(e){}

  // 보관함 업데이트
  const vb = vault.find(b=>b.uuid===currentBoxUUID);
  if(vb){ vb.opened=true; vb.result={grade:result.grade, item:result.item, color:result.gInfo?.color||'#aaa', userName:vb.userName||''}; }
  localStorage.setItem('mb-vault', JSON.stringify(vault));
  renderVault();

  // 결과 표시
  box3d.style.display='none';
  document.getElementById('open-hint').style.display='none';
  const card = document.getElementById('resultCard');
  const gradeEl = document.getElementById('resultGrade');
  const itemEl = document.getElementById('resultItem');
  const labelEl = document.getElementById('resultLabel');

  gradeEl.textContent=result.grade;
  gradeEl.style.color=result.gInfo?.color||'#fff';
  itemEl.textContent=result.item;
  labelEl.textContent=`${result.grade} 등급 · ${result.gInfo?.pct}%`;
  card.style.display='block';
  openPhase=3;
}

// 확률 계산
function roll(items){
  if(!items.length) return {grade:'F', item:'꽝', gInfo:GRADES.find(g=>g.grade==='F')};

  // 아이템별 등급 가져오기
  const grades = assignGrades(items.length);
  const pool = items.map((item,i)=>({
    item: item.name,
    grade: item.grade||grades[i],
    gInfo: GRADES.find(g=>g.grade===(item.grade||grades[i]))
  }));

  // 누적 확률로 뽑기
  const rand = Math.random()*100;
  let cum=0;
  for(const g of GRADES){
    cum+=g.pct;
    const match = pool.filter(p=>p.grade===g.grade);
    if(rand<=cum && match.length){
      return match[Math.floor(Math.random()*match.length)];
    }
  }
  return pool[pool.length-1];
}

// 파티클
function spawnParticles(color){
  const container = document.getElementById('particles');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText=`left:${20+Math.random()*60}%;top:${40+Math.random()*30}%;background:${color};animation-delay:${Math.random()*.5}s;animation-duration:${.8+Math.random()*.6}s`;
    container.appendChild(p);
  }
  setTimeout(()=>container.innerHTML='',2000);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// URL 파라미터로 박스 코드 자동 입력
window.addEventListener('load',()=>{
  try{
    const params=new URLSearchParams(location.search);
    const boxId=params.get('box');
    if(boxId){
      switchTab('user');
      document.getElementById('user-code').value=boxId;
    } else {
      loadAdminBoxes().catch(()=>{});
    }
    renderVault();
    renderAdminItems();
  }catch(e){ console.error(e); }
});
